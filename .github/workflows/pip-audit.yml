# Known advisories in the pinned Python dependencies. Runs on every PR, so a
# new upstream disclosure blocks the next PR until it is fixed or accepted.
name: pip-audit
on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.17"
      - run: pip install pip-audit==2.10.1
      # Both locks are uv-compiled with hashes, so every transitive dependency
      # is already pinned: --disable-pip --require-hashes audits the pins as
      # written. (--no-deps is implied by --require-hashes.)
      - run: >-
          pip-audit --progress-spinner off --disable-pip --require-hashes
          -r requirements.txt -r test-requirements.txt
